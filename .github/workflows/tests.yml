name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke tests
        run: python tests_smoke.py
      - name: Resilience tests
        run: python tests_resilience.py
      - name: Market Monitor tests
        run: python tests_market_monitor.py
      - name: Risk history tests
        run: python tests_history.py
      - name: UI structure tests
        run: python tests_ui_structure.py
      - name: Source freshness tests
        run: python tests_data_freshness.py
      - name: Dashboard cache and public UI regressions
        run: python tests_dashboard_v2.py && python tests_dashboard_app.py
      - name: Compile Python files
        run: python -m py_compile streamlit_app.py app.py services/*.py scripts/*.py

      - name: FastAPI native-web migration smoke
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fastapi-no-streamlit'
        run: |
          python -m pip install -r requirements-web.txt httpx
          python -m py_compile web_app.py tests_fastapi.py
          python tests_fastapi.py
          node --check web_assets/app.js

      - name: Build standalone Docker image without Streamlit
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fastapi-no-streamlit'
        run: docker build --pull --tag moex-native-web:ci .

      - name: Smoke standalone HTTP server and verify runtime dependencies
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fastapi-no-streamlit'
        run: |
          docker run -d --name moex-native-smoke -e PORT=8080 -p 18080:8080 moex-native-web:ci
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18080/health > /tmp/moex-health.json; then break; fi
            sleep 1
          done
          grep -q '"framework":"FastAPI"' /tmp/moex-health.json
          curl -fsS http://127.0.0.1:18080/ | grep -q 'MOEX Risk Dashboard'
          curl -fsS http://127.0.0.1:18080/assets/app.js | grep -q 'loadDashboard'
          curl -fsS http://127.0.0.1:18080/api/methodology | grep -q '"MR1"'
          docker exec moex-native-smoke python -c "import importlib.util; assert importlib.util.find_spec('streamlit') is None"
          docker stop moex-native-smoke
      - name: Audit updated official NCC evening XLSX
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ncc-evening-nov2026'
        run: python -m scripts.audit_ncc_evening_nov

      - name: Audit current ISS against dashboard parsing (non-blocking)
        if: (github.event_name == 'pull_request' && github.head_ref == 'dashboard-v2') || (github.event_name == 'push' && github.ref == 'refs/heads/dashboard-v2')
        continue-on-error: true
        run: python -m scripts.audit_live_iss

