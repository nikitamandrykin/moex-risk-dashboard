name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke tests
        run: python tests_smoke.py
      - name: Resilience tests
        run: python tests_resilience.py
      - name: Market Monitor tests
        run: python tests_market_monitor.py
      - name: Risk history tests
        run: python tests_history.py
      - name: UI structure tests
        run: python tests_ui_structure.py
      - name: Source freshness tests
        run: python tests_data_freshness.py
      - name: Dashboard cache and public UI regressions
        run: python tests_dashboard_v2.py && python tests_dashboard_app.py
      - name: Compile Python files
        run: python -m py_compile streamlit_app.py app.py services/*.py scripts/*.py
      - name: Audit updated official NCC evening XLSX
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/ncc-evening-nov2026'
        run: python -m scripts.audit_ncc_evening_nov

      - name: Audit current ISS against dashboard parsing (non-blocking)
        if: (github.event_name == 'pull_request' && github.head_ref == 'dashboard-v2') || (github.event_name == 'push' && github.ref == 'refs/heads/dashboard-v2')
        continue-on-error: true
        run: python -m scripts.audit_live_iss


      - name: Verify restored Streamlit image on Railway port 8080
        if: github.event_name == 'pull_request' && github.head_ref == 'restore/streamlit-dashboard-20261120'
        run: |
          docker build --tag moex-streamlit-restore:ci .
          docker run -d --name moex-streamlit-restore -e PORT=8080 -p 18080:8080 moex-streamlit-restore:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/_stcore/health | grep -qi 'ok'; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/_stcore/health | grep -qi 'ok'
          curl -fsS http://127.0.0.1:18080/ | grep -qi 'streamlit'
          docker exec moex-streamlit-restore python -c "import streamlit; print(streamlit.__version__)"
          docker stop moex-streamlit-restore
