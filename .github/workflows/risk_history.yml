name: Risk Radar history

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: risk-radar-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Collect rolling 7-day history
        env:
          HISTORY_URL: https://raw.githubusercontent.com/${{ github.repository }}/risk-history/risk_radar_history.csv.gz
        run: |
          python scripts/collect_risk_history.py \
            --output /tmp/risk_radar_history.csv.gz \
            --history-url "$HISTORY_URL" \
            --retention-days 7

      - name: Publish to dedicated history branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin risk-history >/dev/null 2>&1; then
            git fetch origin risk-history:risk-history
            git checkout risk-history
          else
            git checkout --orphan risk-history
            git rm -rf .
          fi

          cp /tmp/risk_radar_history.csv.gz ./risk_radar_history.csv.gz
          cat > README.md <<'EOF'
          # Risk Radar rolling history

          This branch is generated automatically by GitHub Actions and contains
          the rolling 7-day Risk Radar snapshot used by the Streamlit dashboard.
          Do not edit it manually.
          EOF
          git add risk_radar_history.csv.gz README.md

          if git diff --cached --quiet; then
            echo "No meaningful Risk Radar history changes; nothing to commit."
            exit 0
          fi

          git commit -m "Update rolling Risk Radar history"
          git push origin risk-history
